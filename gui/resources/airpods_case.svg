<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 120" fill="none">
  <defs>
    <linearGradient id="caseShell" x1="90" y1="14" x2="90" y2="106" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="68%" stop-color="#F6F7FA"/>
      <stop offset="100%" stop-color="#E5E8F0"/>
    </linearGradient>
    <linearGradient id="lip" x1="36" y1="46" x2="144" y2="46" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E5E8EF"/>
      <stop offset="50%" stop-color="#CFD5E0"/>
      <stop offset="100%" stop-color="#E5E8EF"/>
    </linearGradient>
  </defs>
  <!-- MagSafe Charging Case Body -->
  <rect x="24" y="16" width="132" height="88" rx="32" fill="url(#caseShell)" stroke="#D8DCE6" stroke-width="1.5"/>
  <!-- Lid seam line -->
  <line x1="25" y1="47" x2="155" y2="47" stroke="#DCE0E9" stroke-width="1.4"/>
  <!-- Finger indent -->
  <rect x="70" y="44.5" width="40" height="5" rx="2.5" fill="url(#lip)"/>
  <!-- Status LED dot -->
  <circle cx="90" cy="64" r="2.6" fill="#34C759"/>
  <circle cx="90" cy="64" r="5" fill="#34C759" opacity="0.2"/>
</svg>
