<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 120" fill="none">
  <defs>
    <linearGradient id="podBody" x1="0" y1="14" x2="0" y2="106" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="72%" stop-color="#F4F5F8"/>
      <stop offset="100%" stop-color="#E4E7EE"/>
    </linearGradient>
    <linearGradient id="tipGrad" x1="0" y1="22" x2="0" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FAFBFD"/>
      <stop offset="100%" stop-color="#DFE3EC"/>
    </linearGradient>
  </defs>
  <!-- Left AirPod Pro -->
  <g transform="translate(8, 6)">
    <!-- Silicone ear tip -->
    <ellipse cx="22" cy="36" rx="14" ry="17" transform="rotate(-14 22 36)" fill="url(#tipGrad)" stroke="#D5DAE4" stroke-width="1.2"/>
    <!-- Acoustic head -->
    <ellipse cx="43" cy="34" rx="22" ry="19" transform="rotate(-12 43 34)" fill="url(#podBody)" stroke="#D8DCE6" stroke-width="1.3"/>
    <!-- Angled stem -->
    <rect x="47" y="42" width="13" height="54" rx="6.5" transform="rotate(-14 47 42)" fill="url(#podBody)" stroke="#D8DCE6" stroke-width="1.2"/>
    <!-- Silver stem cap -->
    <rect x="58" y="90" width="12" height="5" rx="2.5" transform="rotate(-14 58 90)" fill="#C7CDD8"/>
    <!-- Black acoustic vent & optical sensor -->
    <ellipse cx="46" cy="26" rx="5.5" ry="2.4" transform="rotate(-22 46 26)" fill="#1D1D1F"/>
    <circle cx="34" cy="37" r="2.6" fill="#2C2C2E"/>
  </g>
  <!-- Right AirPod Pro -->
  <g transform="translate(172, 6) scale(-1, 1)">
    <ellipse cx="22" cy="36" rx="14" ry="17" transform="rotate(-14 22 36)" fill="url(#tipGrad)" stroke="#D5DAE4" stroke-width="1.2"/>
    <ellipse cx="43" cy="34" rx="22" ry="19" transform="rotate(-12 43 34)" fill="url(#podBody)" stroke="#D8DCE6" stroke-width="1.3"/>
    <rect x="47" y="42" width="13" height="54" rx="6.5" transform="rotate(-14 47 42)" fill="url(#podBody)" stroke="#D8DCE6" stroke-width="1.2"/>
    <rect x="58" y="90" width="12" height="5" rx="2.5" transform="rotate(-14 58 90)" fill="#C7CDD8"/>
    <ellipse cx="46" cy="26" rx="5.5" ry="2.4" transform="rotate(-22 46 26)" fill="#1D1D1F"/>
    <circle cx="34" cy="37" r="2.6" fill="#2C2C2E"/>
  </g>
</svg>
