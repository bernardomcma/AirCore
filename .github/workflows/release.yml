name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v2.13.0). Defaults to v<Cargo.toml version> when empty.'
        required: false
        type: string
      prerelease:
        description: 'Mark release as pre-release'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release-windows:
    name: Build & Release (Windows x86_64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Determine release tag
        id: meta
        shell: bash
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          elif [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          else
            VERSION="$(grep -m1 '^version = ' Cargo.toml | sed -E 's/version = "([^"]+)"/\1/')"
            TAG="v${VERSION}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Install Rust
        run: rustup install --profile minimal stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Install just
        run: choco install just -y

      - name: Build CLI
        run: just build-cli

      - name: Build GUI
        run: just build-gui

      - name: Build Windows installer
        run: just build-gui-installer

      - name: Package artifacts & checksums
        shell: bash
        run: |
          mv build-output/openscq30.exe build-output/aircore-cli-windows-x86_64.exe
          mv build-output/openscq30-gui.exe build-output/aircore-gui-windows-x86_64.exe
          mv build-output/openscq30-gui-installer.exe build-output/aircore-gui-installer-windows-x86_64.exe
          (cd build-output && sha256sum aircore-*.exe > aircore-windows-x86_64-checksums.sha256)

      - name: Attest artifacts
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: build-output/*

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-release-${{ steps.meta.outputs.tag }}
          path: build-output/*

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: AirCore ${{ steps.meta.outputs.tag }}
          prerelease: ${{ inputs.prerelease || contains(steps.meta.outputs.tag, '-') }}
          generate_release_notes: true
          files: |
            build-output/aircore-gui-installer-windows-x86_64.exe
            build-output/aircore-gui-windows-x86_64.exe
            build-output/aircore-cli-windows-x86_64.exe
            build-output/aircore-windows-x86_64-checksums.sha256
