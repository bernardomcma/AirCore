name: build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install rust
        run: rustup install --profile minimal stable
      - name: Install just
        run: choco install just

      - name: Build cli
        run: just build-cli
      - name: Build gui
        run: just build-gui
      - name: Build installer
        run: just build-gui-installer

      - name: Add platform to file name
        shell: bash
        run: |
          mv build-output/openscq30.exe build-output/aircore-cli-windows-x86_64.exe
          mv build-output/openscq30-gui.exe build-output/aircore-gui-windows-x86_64.exe
          mv build-output/openscq30-gui-installer.exe build-output/aircore-gui-installer-windows-x86_64.exe

      - name: Attest artifacts
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: build-output/*

      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows
          path: build-output/*
